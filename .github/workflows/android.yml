name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # --- ДОБАВЛЕННЫЙ ШАГ: Выдаем права на выполнение ---
    - name: Make gradlew executable
      run: chmod +x gradlew
    # ---------------------------------------------------

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon

    - name: List generated APKs and sizes
      run: |
        echo "📦 Сгенерированные APK:"
        ls -lh app/build/outputs/apk/release/*.apk || echo "APK не найдены"

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: greenstash-release-arm64-v8a
        path: app/build/outputs/apk/release/*arm64-v8a.apk
        retention-days: 2
        if-no-files-found: error
